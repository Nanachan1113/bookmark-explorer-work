<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookmark Explorer — 学習用</title>
  <link rel="stylesheet" href="popup.css">
    <script type="module" src="src/main.js"></script>
</head>
<body>
  <header><h1>Bookmark Explorer</h1><p>読み取り専用・学習用</p></header>
  <main>
    <section class="metrics" aria-label="件数">
      <div class="metric"><b id="total-count">0</b><span>総数</span></div>
      <div class="metric"><b id="visible-count">0</b><span>表示中</span></div>
      <div class="metric"><b id="folder-count">0</b><span>フォルダ</span></div>
    </section>
    <div class="controls">
      <label for="search-input">検索<input id="search-input" type="search" placeholder="タイトル・URLを検索"></label>

                  <label for="folder-filter">フォルダ直下<select id="folder-filter">
  <option value="">すべてのフォルダ</option>

</select></label><div class="inline">
  <label for="sort-order">並べ替え<select id="sort-order"><option value="TITLE">タイトル順</option><option value="NEWEST">追加日時が新しい順</option></select></label>
  <label class="toggle" for="show-url"><input id="show-url" type="checkbox" checked> URLを表示</label>
</div>
      <button id="reload-button" type="button">再読み込み</button>

    </div>
    <p id="status" role="status" aria-live="polite">読込前です。</p>
        <p id="settings-status" role="status" aria-live="polite"></p>
<ul id="bookmark-list" aria-label="ブックマーク一覧"></ul>
    <p class="hint">※ 学習用。ブックマークの作成・変更・削除はしません。</p>
  </main>
</body>
</html>
